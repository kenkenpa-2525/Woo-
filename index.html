<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA飲食 勤怠・稼働時間管理ツール</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-hover: #0284c7;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border-bottom: 4px solid var(--accent-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-primary);
        }

        .timer-box {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .timer-val {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: monospace;
            color: var(--accent-primary);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-off { background-color: #475569; color: #fff; }
        .status-working { background-color: var(--success); color: #fff; }
        .status-paused { background-color: var(--warning); color: #000; }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        @media(min-width: 600px) {
            .btn-group {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn-clockin { background-color: var(--success); }
        .btn-clockin:hover:not(:disabled) { opacity: 0.9; }

        .btn-pause { background-color: var(--warning); color: #000; }
        .btn-pause:hover:not(:disabled) { opacity: 0.9; }

        .btn-resume { background-color: var(--accent-primary); color: #000; }
        .btn-resume:hover:not(:disabled) { opacity: 0.9; }

        .btn-clockout { background-color: var(--danger); }
        .btn-clockout:hover:not(:disabled) { opacity: 0.9; }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--input-bg);
            color: var(--text-muted);
            font-weight: 600;
        }

        .actions-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-sub {
            background-color: var(--border-color);
            color: var(--text-main);
            font-size: 0.85rem;
            padding: 8px 14px;
        }

        .btn-sub:hover { background-color: #475569; }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .sum-card {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
        }

        .sum-card-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .sum-card-val {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-primary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>🍸 GTA飲食 勤怠・稼働管理</h1>
            <p>ブラウザだけで勤怠管理と勤務時間の自動集計を完結できます</p>
        </div>
    </header>

    <div class="card">
        <div class="card-title">
            <span>⏱️ リアルタイム勤怠操作</span>
            <span id="statusBadge" class="status-badge status-off">未出勤</span>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="staffName">スタッフ名</label>
                <input type="text" id="staffName" placeholder="例: 山田 太郎" oninput="saveName()">
            </div>
        </div>

        <div class="timer-box">
            <div class="timer-val" id="timerDisplay">00:00:00</div>
        </div>

        <div class="btn-group">
            <button id="btnClockIn" class="btn-clockin" onclick="handleClockIn()">▶ 出勤</button>
            <button id="btnPause" class="btn-pause" onclick="handlePause()" disabled>⏸ 一時退勤</button>
            <button id="btnResume" class="btn-resume" onclick="handleResume()" disabled>🔄 再勤務</button>
            <button id="btnClockOut" class="btn-clockout" onclick="handleClockOut()" disabled>⏹ 退勤</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📊 稼働時間集計サマリー</div>
        <div class="summary-cards" id="summaryCards">
            <div class="sum-card">
                <div class="sum-card-title">総勤務回数</div>
                <div class="sum-card-val" id="totalShifts">0 回</div>
            </div>
            <div class="sum-card">
                <div class="sum-card-title">全体の総稼働時間</div>
                <div class="sum-card-val" id="totalWorkTime">0分</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📋 勤務履歴一覧</div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>日付</th>
                        <th>名前</th>
                        <th>出勤時刻</th>
                        <th>退勤時刻</th>
                        <th>一時退勤</th>
                        <th>実働時間</th>
                    </tr>
                </thead>
                <tbody id="logsTable">
                    <tr><td colspan="6" style="text-align:center; color: var(--text-muted);">履歴はありません</td></tr>
                </tbody>
            </table>
        </div>

        <div class="actions-bar">
            <button class="btn-sub" onclick="copyDiscordSummary()">Discord報告用にテキストコピー</button>
            <button class="btn-sub" onclick="clearLogs()">履歴リセット</button>
        </div>
    </div>
</div>

<script>
    var currentState = 'OFF';
    var startTime = null;
    var pauseStartTime = null;
    var totalPauseMs = 0;
    var timerInterval = null;
    var logs = [];

    // ページ読み込み時の処理（復元）
    window.onload = function() {
        var savedName = localStorage.getItem('gta_web_staff_name');
        var savedLogs = localStorage.getItem('gta_web_logs');
        var savedActiveState = localStorage.getItem('gta_web_active_state');

        if (savedName) document.getElementById('staffName').value = savedName;
        
        if (savedLogs) {
            try {
                logs = JSON.parse(savedLogs);
                renderLogs();
            } catch (e) {
                logs = [];
            }
        }

        // 実行中のタイマー状態を復元
        if (savedActiveState) {
            try {
                var stateObj = JSON.parse(savedActiveState);
                currentState = stateObj.currentState;
                startTime = stateObj.startTime ? new Date(stateObj.startTime) : null;
                pauseStartTime = stateObj.pauseStartTime ? new Date(stateObj.pauseStartTime) : null;
                totalPauseMs = stateObj.totalPauseMs || 0;

                setUIState(currentState);

                if (currentState === 'WORKING' || currentState === 'PAUSED') {
                    updateTimer();
                    timerInterval = setInterval(updateTimer, 1000);
                }
            } catch (e) {
                clearActiveState();
            }
        }
    };

    // スタッフ名の保存
    function saveName() {
        var el = document.getElementById('staffName');
        if (el) localStorage.setItem('gta_web_staff_name', el.value.trim());
    }

    // 稼働中タイマー情報の保存
    function saveActiveState() {
        var stateObj = {
            currentState: currentState,
            startTime: startTime ? startTime.toISOString() : null,
            pauseStartTime: pauseStartTime ? pauseStartTime.toISOString() : null,
            totalPauseMs: totalPauseMs
        };
        localStorage.setItem('gta_web_active_state', JSON.stringify(stateObj));
    }

    // 稼働中タイマー情報の削除
    function clearActiveState() {
        localStorage.removeItem('gta_web_active_state');
    }

    function formatTime(dateStr) {
        if (!dateStr) return '-';
        var d = new Date(dateStr);
        return d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        var d = new Date(dateStr);
        return (d.getMonth() + 1) + '/' + d.getDate();
    }

    function formatDuration(ms) {
        var sec = Math.floor(ms / 1000);
        var h = Math.floor(sec / 3600);
        var m = Math.floor((sec % 3600) / 60);
        var s = sec % 60;
        return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
    }

    function formatDurationText(ms) {
        var sec = Math.floor(ms / 1000);
        var h = Math.floor(sec / 3600);
        var m = Math.floor((sec % 3600) / 60);
        if (h > 0) return h + '時間' + m + '分';
        return m + '分';
    }

    function updateTimer() {
        if (currentState === 'WORKING') {
            var now = new Date();
            var elapsed = now - startTime - totalPauseMs;
            document.getElementById('timerDisplay').innerText = formatDuration(Math.max(0, elapsed));
        } else if (currentState === 'PAUSED') {
            var elapsed = pauseStartTime - startTime - totalPauseMs;
            document.getElementById('timerDisplay').innerText = formatDuration(Math.max(0, elapsed));
        }
    }

    function setUIState(state) {
        currentState = state;
        var badge = document.getElementById('statusBadge');
        var btnClockIn = document.getElementById('btnClockIn');
        var btnPause = document.getElementById('btnPause');
        var btnResume = document.getElementById('btnResume');
        var btnClockOut = document.getElementById('btnClockOut');

        if (state === 'OFF') {
            badge.className = 'status-badge status-off';
            badge.innerText = '未出勤';
            btnClockIn.disabled = false;
            btnPause.disabled = true;
            btnResume.disabled = true;
            btnClockOut.disabled = true;
            document.getElementById('timerDisplay').innerText = '00:00:00';
            if (timerInterval) clearInterval(timerInterval);
        } else if (state === 'WORKING') {
            badge.className = 'status-badge status-working';
            badge.innerText = '勤務中';
            btnClockIn.disabled = true;
            btnPause.disabled = false;
            btnResume.disabled = true;
            btnClockOut.disabled = false;
        } else if (state === 'PAUSED') {
            badge.className = 'status-badge status-paused';
            badge.innerText = '一時退勤中';
            btnClockIn.disabled = true;
            btnPause.disabled = true;
            btnResume.disabled = false;
            btnClockOut.disabled = false;
        }
    }

    function handleClockIn() {
        var nameInput = document.getElementById('staffName');
        var name = nameInput ? nameInput.value.trim() : '';
        if (!name) {
            alert('スタッフ名を入力してください');
            return;
        }
        startTime = new Date();
        totalPauseMs = 0;
        setUIState('WORKING');
        saveActiveState();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 1000);
    }

    function handlePause() {
        pauseStartTime = new Date();
        setUIState('PAUSED');
        saveActiveState();
    }

    function handleResume() {
        var now = new Date();
        totalPauseMs += (now - pauseStartTime);
        pauseStartTime = null;
        setUIState('WORKING');
        saveActiveState();
    }

    function handleClockOut() {
        var endTime = new Date();
        if (currentState === 'PAUSED' && pauseStartTime) {
            totalPauseMs += (endTime - pauseStartTime);
        }

        var totalElapsed = endTime - startTime;
        var workMs = Math.max(0, totalElapsed - totalPauseMs);
        var nameInput = document.getElementById('staffName');
        var name = nameInput ? nameInput.value.trim() : '';

        var newLog = {
            id: Date.now(),
            name: name,
            start: startTime.toISOString(),
            end: endTime.toISOString(),
            pauseMs: totalPauseMs,
            workMs: workMs
        };

        logs.unshift(newLog);
        try {
            localStorage.setItem('gta_web_logs', JSON.stringify(logs));
        } catch(e) {}
        
        clearActiveState();
        renderLogs();
        setUIState('OFF');
    }

    function renderLogs() {
        var tbody = document.getElementById('logsTable');
        if (logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">履歴はありません</td></tr>';
            document.getElementById('totalShifts').innerText = '0 回';
            document.getElementById('totalWorkTime').innerText = '0分';
            return;
        }

        var html = '';
        for (var i = 0; i < logs.length; i++) {
            var log = logs[i];
            html += '<tr>' +
                '<td>' + formatDate(log.start) + '</td>' +
                '<td><strong>' + escapeHtml(log.name) + '</strong></td>' +
                '<td>' + formatTime(log.start) + '</td>' +
                '<td>' + formatTime(log.end) + '</td>' +
                '<td>' + formatDurationText(log.pauseMs) + '</td>' +
                '<td><strong style="color: var(--success);">' + formatDurationText(log.workMs) + '</strong></td>' +
            '</tr>';
        }
        tbody.innerHTML = html;

        var totalMs = 0;
        for (var j = 0; j < logs.length; j++) {
            totalMs += logs[j].workMs;
        }
        document.getElementById('totalShifts').innerText = logs.length + ' 回';
        document.getElementById('totalWorkTime').innerText = formatDurationText(totalMs);
    }

    function clearLogs() {
        if (confirm('すべての履歴をクリアしますか？')) {
            logs = [];
            try {
                localStorage.removeItem('gta_web_logs');
            } catch(e) {}
            renderLogs();
        }
    }

    function copyDiscordSummary() {
        if (logs.length === 0) {
            alert('コピーする履歴がありません');
            return;
        }

        var latest = logs[0];
        var text = '【勤務報告】\n' +
            '名前: ' + latest.name + '\n' +
            '出勤: ' + formatTime(latest.start) + '\n' +
            '退勤: ' + formatTime(latest.end) + '\n' +
            '一時退勤: ' + formatDurationText(latest.pauseMs) + '\n' +
            '実働時間: ' + formatDurationText(latest.workMs);
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
                alert('Discord用フォーマットでクリップボードにコピーしました！\nDiscordにそのまま貼り付けできます。');
            });
        } else {
            alert(text);
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
    }
</script>
</body>
</html>
